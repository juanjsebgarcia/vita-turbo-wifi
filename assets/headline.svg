<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- deep royal-blue backdrop with a lighter bloom behind the title -->
    <radialGradient id="bg" cx="0.32" cy="0.05" r="1.15">
      <stop offset="0"    stop-color="#1b4fd1"/>
      <stop offset="0.38" stop-color="#0b2a86"/>
      <stop offset="0.75" stop-color="#051647"/>
      <stop offset="1"    stop-color="#020a26"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#9fd3ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#cfe9ff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#7cc4ff" stop-opacity="0.7"/>
      <stop offset="1"   stop-color="#9fd3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="numFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9e4ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.45  0 0 0 0 0.72  0 0 0 0 1  0 0 0 0.5 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .t    { font-family: -apple-system, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; }
      .h1   { font-size: 50px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
      .h1l  { font-size: 50px; font-weight: 300; fill: #cfe3ff; letter-spacing: -0.5px; }
      .h2   { font-size: 21px; font-weight: 400; fill: #b8cff2; }
      .big  { font-size: 66px; font-weight: 800; fill: url(#numFill); letter-spacing: -1px; }
      .lbl  { font-size: 21px; font-weight: 600; fill: #f1f6ff; }
      .sub  { font-size: 16px; font-weight: 400; fill: #a9c4ee; }
      .badge{ font-size: 17px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- light ribbons (generic waves) -->
  <g fill="none" stroke-linecap="round">
    <path d="M -40 470 C 220 380, 420 560, 700 470 S 1060 380, 1260 450" stroke="url(#ribbon)" stroke-width="2.4" opacity="0.55" filter="url(#soft)"/>
    <path d="M -40 500 C 260 420, 460 590, 740 495 S 1080 410, 1260 485" stroke="url(#ribbon)" stroke-width="1.4" opacity="0.45"/>
    <path d="M -40 535 C 240 470, 480 610, 760 525 S 1100 455, 1260 520" stroke="url(#ribbon)" stroke-width="3.2" opacity="0.25" filter="url(#soft)"/>
    <path d="M -40 420 C 300 340, 500 500, 820 420 S 1120 350, 1260 400" stroke="url(#ribbon)" stroke-width="1" opacity="0.35"/>
    <path d="M -40 120 C 260 60, 520 190, 820 110 S 1100 40, 1260 90" stroke="url(#ribbon)" stroke-width="1" opacity="0.18"/>
  </g>

  <!-- bokeh -->
  <g fill="#bfe0ff" filter="url(#bokeh)">
    <circle cx="1080" cy="150" r="7" opacity="0.30"/>
    <circle cx="1010" cy="128" r="4" opacity="0.35"/>
    <circle cx="880"  cy="40"  r="5" opacity="0.25"/>
    <circle cx="160"  cy="600" r="6" opacity="0.28"/>
    <circle cx="420"  cy="610" r="4" opacity="0.30"/>
    <circle cx="690"  cy="598" r="8" opacity="0.18"/>
    <circle cx="1140" cy="602" r="5" opacity="0.30"/>
    <circle cx="560"  cy="30"  r="3" opacity="0.30"/>
  </g>

  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- title, subtitle, firmware badge -->
  <text class="t" x="60" y="92"><tspan class="h1">Wi-Fi Turbo</tspan><tspan class="h1l"> for PS Vita</tspan></text>
  <text class="t h2" x="60" y="128">A taiHEN plugin that fixes the Vita's Wi-Fi. Stock vs Turbo, measured on hardware.</text>
  <rect x="918" y="58" width="222" height="42" rx="21" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
  <text class="t badge" x="1029" y="85" text-anchor="middle">FIRMWARE 3.60 ONLY</text>

  <!-- tiles -->
  <g>
    <rect x="60"  y="164" width="340" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="430" y="164" width="340" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="800" y="164" width="340" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="60"  y="388" width="340" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="430" y="388" width="340" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="800" y="388" width="340" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <!-- top highlight lines -->
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1">
      <line x1="84"  y1="165" x2="376"  y2="165"/>
      <line x1="454" y1="165" x2="746"  y2="165"/>
      <line x1="824" y1="165" x2="1116" y2="165"/>
      <line x1="84"  y1="389" x2="376"  y2="389"/>
      <line x1="454" y1="389" x2="746"  y2="389"/>
      <line x1="824" y1="389" x2="1116" y2="389"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <text class="t big" x="88"  y="252">+51%</text>
    <text class="t big" x="458" y="252">13×</text>
    <text class="t big" x="828" y="252">150</text>
    <text class="t big" x="88"  y="476">+20%</text>
    <text class="t big" x="458" y="476">~30 s</text>
    <text class="t big" x="828" y="476">3 s</text>
  </g>

  <text class="t lbl" x="88"  y="296">UDP throughput</text>
  <text class="t sub" x="88"  y="328">43.5 → 65.6 Mbps</text>
  <text class="t lbl" x="458" y="296">faster wake-up latency</text>
  <text class="t sub" x="458" y="328">~99 ms → 7.4 ms median</text>
  <text class="t lbl" x="828" y="296">Mbps link rate (40 MHz)</text>
  <text class="t sub" x="828" y="328">stock radio stops at 72 Mbps</text>

  <text class="t lbl" x="88"  y="520">TCP throughput</text>
  <text class="t sub" x="88"  y="552">33.9 → 40.6 Mbps</text>
  <text class="t lbl" x="458" y="520">auto-connect from cold boot</text>
  <text class="t sub" x="458" y="552">stock: gives up, waits for you</text>
  <text class="t lbl" x="828" y="520">back online after a drop</text>
  <text class="t sub" x="828" y="552">no menus, no button presses</text>
</svg>
